name: repo-checks

on:
  push:
    branches:
      - main
    paths:
      - 'justfile'
      - 'addon/scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'justfile'
      - 'addon/scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check just
        run: just --list

      - name: Syntax-check scripts
        run: |
          set -euo pipefail
          find addon/scripts -type f -name '*.sh' -print0 | xargs -0 bash -n
