name: harness-tests

on:
  pull_request:
    paths:
      - 'addon/**'
      - '.github/workflows/harness-tests.yml'
  push:
    branches: [main]
    paths:
      - 'addon/**'
      - '.github/workflows/harness-tests.yml'
  workflow_dispatch:

concurrency:
  group: harness-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - name: Test
        working-directory: addon/harness
        run: cargo test --locked
