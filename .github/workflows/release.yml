name: release

# Every push to main runs the checks, then publishes an addon release when its commits ask for one.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  addon:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Bump version
        id: bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/auto_release.py maybe-bump --root addon --before "${{ github.event.before }}" --after "${{ github.sha }}"

      - name: Pack Everlook
        if: steps.bump.outputs.release != 'false'
        id: pack
        run: |
          set -euo pipefail
          if [[ -n "${{ steps.bump.outputs.version }}" ]]; then
            version="${{ steps.bump.outputs.version }}"
          else
            version="$(awk -F': ' '/^## Version:/{gsub("\r","",$2); print $2; exit}' addon/Everlook/Everlook.toc)"
          fi
          archive="$(bash scripts/pack.sh "${version}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
          tar -tzf "${archive}" | awk 'NR<=10'

      - name: Commit version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bump.outputs.bumped == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon/Everlook/Everlook.toc
          git commit -m "chore: release addon ${{ steps.bump.outputs.version }}"
          # If main moved since the checkout, this push is rejected and nothing is tagged. The archive was packed
          # from the checkout, so a rebase would tag commits it does not hold. The next run counts from the last
          # tag and releases both pushes.
          git push origin HEAD:main

      - name: Tag and publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bump.outputs.release != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pack.outputs.version }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          tag="addon-v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; nothing to publish."
            exit 0
          fi
          # Notes cover everything since the last addon release, so a push that
          # did not release (docs, tests) still shows up in the next one.
          since="$(git describe --tags --abbrev=0 --match 'addon-v*' HEAD 2>/dev/null || true)"
          if [[ -z "${since}" ]]; then
            since="${BEFORE}"
          fi
          python3 scripts/auto_release.py release-notes --root addon --since "${since}" > "${RUNNER_TEMP}/notes.md" \
            || echo "See the commit history for this release." > "${RUNNER_TEMP}/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Everlook addon ${VERSION}"
          git push origin "${tag}"
          archive="${{ steps.pack.outputs.archive }}"
          gh release create "${tag}" "${archive}" "${archive%.tar.gz}.zip" "$(dirname "${archive}")/SHA256SUMS" \
            --verify-tag \
            --title "Everlook addon ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
